; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

;Speed and port for serial monitor
;Monitor speed means the baud rate for serial communication, and monitor port specifies the COM port to which the ESP32 is connected.
;A higher baud rate allows for faster data transfer, but both the ESP32 and the connected device must support it. The COM port must match the one assigned to the ESP32 by the operating system.
monitor_speed = 115200
monitor_port = COM4

;Upload speed and port for flashing the ESP32
;Upload speed is the baud rate used for uploading the firmware to the ESP32, and upload
;port specifies the COM port to which the ESP32 is connected for flashing. The upload speed can be set to a higher value for faster uploads, but it must be supported by both the ESP32 and the connected device. 
;The COM port must match the one assigned to the ESP32 by the operating system.
upload_speed = 115200
upload_port = COM4


;Configuration of the ESP32 flash size and memory type
;In this project, flash_size is set to 8MB, which means the ESP32 has 8 megabytes of flash memory available for storing the firmware and other data.
;The memory_type is set to qio_api, which indicates that the ESP32 is using Quad I/O (QIO) mode for accessing the flash memory. 
;QIO mode allows for faster data transfer between the ESP32 and the flash memory compared to other modes like DIO (Dual I/O) or SIO (Single I/O).    
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

;Instuctions for the ESP when it is powered on or reset
build_flags =
    -DBOARD_HAS_PSRAM ; Enable PSRAM
    


;When we want to monitor the serial output of the ESP32, we can use the monitor_filters option to apply a filter to the output.
;In this case, we are using the esp32_exception_decoder filter, which decodes and 
;displays exception information in a more readable format.
monitor_filters = esp32_exception_decoder
build_type = debug

  
